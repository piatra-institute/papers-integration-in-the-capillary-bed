web_blurb: Paired capillary inputs offer a setting for distinguishing distributed electrical interaction from independent sensing coupled to a shared vascular nonlinearity. Comparing sibling and distant inputs with matched single-site waveforms establishes a geometry contrast that vanishes for deterministic controllers receiving identical pooled inputs, while a membrane network predicts a nonzero contrast and supplies a quantified synthetic discrimination design.
