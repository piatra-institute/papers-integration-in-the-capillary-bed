  kind: interpretation
  passage: At this same protocol and time window, the source-screen ensemble spans 0.128 to 0.271 mV, and the single-trace sensitivity set spans 0.134 to 0.280 mV. These intervals compare varying distributed parameters with fixed nominal rival fits. They neither integrate uncertainty in each rival nor establish separation over the entire physiological parameter space. The pooled-controller invariance remains exact only when its summed single-input drives are matched.
