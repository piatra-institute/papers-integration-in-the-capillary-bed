  rationale: The two displayed flow definitions subtract algebraically to F(H_AB)-F(H_A+H_B); this is an identity for the common map, including its normalized baseline.
- id: pooled-invariance
  kind: interpretation
  passage: 'identical summed input functions and initial states imply identical outputs whenever the state equation has a unique solution. This remains true when $f$ and $g$ are nonlinear and when the common diameter-to-flow transformation follows the controller. Its paired geometry contrast therefore vanishes:'
  rationale: Uniqueness of a deterministic state equation with the same drive and initial state implies the same trajectory; the claim is restricted to the stated pooled-input class.
- id: fixed-model
  kind: assumption
  passage: The primary model has homogeneous capillary conductances within a network; parameter uncertainty varies them across model instances. It does not represent cell-to-cell channel heterogeneity. The sampled coupling interval is a selected part of the published exploration range, because capillary junctional resistance has not been directly measured in the cited model study [@moshkforoush2020]. The generated geometry and homogeneous membrane law define the population of model instances to which the predictions apply.
  rationale: Homogeneous membrane parameters and sealed finite topology define the model class. The parameter ensemble does not represent within-network heterogeneity.
- id: source-footprint
  kind: assumption
  passage: 'We draw 8192 parameter vectors, uniformly in the conductances and uniformly in log coupling resistance, and compare connected exposure regions of 8 and 16 cells. Each receives one imposed potassium waveform. The imposed waveform covers one connected portion of a distal subtree. Its correspondence to the experimental solution plume is unknown; exposure size is a structural assumption. The smaller and larger regions give the following finite-sample screen:'
  rationale: One connected imposed exposure region is treated as a single external stimulus. Its relation to an experimental plume is unmeasured and is varied explicitly.
- id: output-law
  kind: assumption
  passage: Here $H$ is hyperpolarization in mV. The chosen fractional diameter ceiling and voltage scale are assumptions, reality-checked against the dilation scale and near-maximal dilation during hyperpolarization reported by Longden and colleagues [@longden2017]. They are fixed across mechanisms and never fitted to paired responses. The flow relation assumes fixed pressure drop, vessel length and viscosity; it is a feeding-segment flow proxy. It does not calculate flow redistribution in the capillary network.
  rationale: The common output map is stipulated and shared; the fourth-power flow relation is conditional on fixed pressure, viscosity and segment length.
- id: calibration-scope
  kind: interpretation
  passage: 'The model-comparison targets are explicitly synthetic: 12 isolated-site voltage traces from the selected model on the base tree, plus its broad-exposure endpoint and recovery. Each mechanistic rival refits 3 parameters within the same conductance and coupling bounds. Endpoint and recovery residuals receive weight 10 in the least-squares objective. Mechanistic fits use a common multistart schedule, and paired responses never enter any fitting objective. Successful optimization does not guarantee an equally good fit; the results below expose each rival''s remaining single-site error.'
  rationale: Synthetic isolated-input fitting establishes conditional distinguishability, not empirical validation. Published aggregate endpoints only restrict plausibility.
- id: rival-fairness
  kind: interpretation
  passage: Table B compares isolated-site calibration error with prediction error against the distributed generator on the complete withheld paired set. Values are in mV. Broad error is signed endpoint error. Exact entries are supplied by construction. A rival with a poor broad-exposure fit is already distinguished by calibration and provides a weaker held-out comparison.
  rationale: Unequal isolated-input calibration is exposed. The exact-single oracle and pooled-input invariance supply the central structural test; the sequential bounded filter is reported even when it fits poorly.
- id: uncertainty-scope
  kind: interpretation
  passage: At this protocol and the simulated averaging window, the source-screen ensemble spans 0.494 to 0.983 mV, and the single-trace sensitivity set spans 0.572 to 0.968 mV. The comparison is with the pooled-controller invariant zero, so uncertainty in that controller's parameters cannot widen the null when its input functions match. These finite sampled envelopes quantify sensitivity against the invariant null; discriminating among distributed localization variants remains a separate estimation problem.
  rationale: Finite sampled distributed-model sensitivity envelopes are compared with an exact parameter-invariant pooled null. Joint uncertainty or separation among distributed localization variants is not claimed.
- id: precision
  kind: assumption
  passage: For measured singleton controls, the common first input cancels, leaving $H_{AB}-H_{AC}-H_B+H_C$. If these four condition means have independent standard error $s$, then $\operatorname{SE}(G_V)=2s$. At two-sided significance 5% and power 80%, the nominal gap from the pooled zero requires $s\leq$ 0.1487 mV, equivalent to a contrast standard error of 0.2974 mV. Assuming a per-preparation standard deviation of 1 mV gives 46 observations per condition. Using the smallest sampled source-screen and single-trace effects instead gives 129 and 96 observations per condition. These calculations concern the simulated window and assumed noise; a response-aligned assay requires pilot estimates of its effect and covariance. Repeated imaging frames are not independent preparations.
  rationale: Variance adds over four independent condition means. Gaussian quantiles give the stated planning calculation; noise and independence are explicit assumptions.
- id: physiological-scope
  kind: interpretation
  passage: A model-generated paired response is a prediction of an assumed mechanism. Its discrepancy from a fitted rival measures distinguishability within this synthetic comparison. Single-site agreement narrows a model family but does not independently validate its spatial mechanism. Unmeasured coupling, channel heterogeneity, membrane resetting and boundary loads remain potential sources of disagreement with tissue.
  rationale: The benchmark compares simulations to simulations. No paired physiological dataset was acquired or used to validate these predictions.
