- id: precision-envelope-1
  kind: computation
  passage: For measured singleton controls, the common first input cancels, leaving $H_{AB}-H_{AC}-H_B+H_C$. If these four condition means have independent standard error $s$, then $\operatorname{SE}(G_V)=2s$. At two-sided significance 5% and power 80%, the nominal gap from the pooled zero requires $s\leq$ 0.1487 mV, equivalent to a contrast standard error of 0.2974 mV. Assuming a per-preparation standard deviation of 1 mV gives 46 observations per condition. Using the smallest sampled source-screen and single-trace effects instead gives 129 and 96 observations per condition. These calculations concern the simulated window and assumed noise; a response-aligned assay requires pilot estimates of its effect and covariance. Repeated imaging frames are not independent preparations.
