- id: number-173
  kind: computation
  passage: Can paired capillary inputs distinguish distributed electrical interaction from independent sensing and a shared vascular nonlinearity? We implement a literature-constrained membrane network, screen single-exposure magnitude and reversibility, and fit rivals only to isolated-input responses. Of 8192 sampled parameter vectors, 29 meet the criteria for the chosen connected exposure footprint; a smaller footprint admits none. Across 128 withheld paired protocols, a nonlinear dynamic filter fits isolated responses with 0.078 mV error but has 0.299 mV prediction error against the distributed model. The central measurement compares sibling and distant input pairs with matched single-site waveforms. The nominal geometry contrast is 0.212 mV, while any controller driven only by their identical pooled inputs predicts zero. Refitted localization ablations retain geometry effects; the nearest nominal gap is 0.107 mV. Distinguishing that gap requires per-condition mean standard error of 0.0192 mV under the stated planning assumptions. Parameter sensitivity and focal-block predictions specify the limits of this comparison. The contribution is a quantified discrimination test, not the already proposed idea of capillary summation. Unknown exposure geometry and coupling, fixed membrane assumptions, and synthetic calibration prevent these predictions from identifying the mechanism used in an intact brain.
  evidence:
    file: simulation/output/results.json
    run_id: paired-study
    pointer: /calibration/candidate_count
    reported: '8192'
    scale: 1
    decimals: 0
    units: sampled parameter vectors
    conditions: 'Single-input-only base-tree screen/fitting: connected exposure at10mM for18s and5s recovery; isolated-site traces span6,8,10,12mM. Parameter sampling and weights are stated in the recorded configuration; no empirical likelihood or paired fitting.'
