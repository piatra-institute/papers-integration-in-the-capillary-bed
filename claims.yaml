- id: reset-rates-1
  kind: computation
  passage: PIP2 depletion can shift capillary channels toward depolarizing TRPV4 activity and away from hyperpolarizing Kir activity [@harraz2018]. We test an imposed receptor drive coincident with the potassium exposure. During this drive, Kir availability falls exponentially and a complementary ohmic depolarizing conductance rises; both modulations decay exponentially after exposure. The published pharmacological time constants are 384 s for Kir suppression and 294 s for TRPV4 recruitment. We also test an assumed 60 s recruitment timescale, assume 180 s recovery, vary maximal depolarizing conductance, and compare modulation throughout the capillaries with modulation confined to the exposure patch. These are transfers and sensitivity assumptions for the reduced model; the source experiment does not identify a potassium-triggered reset law.
