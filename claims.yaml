- id: precision
  kind: assumption
  passage: For the residual geometry contrast, cancellation leaves four condition means. If each mean has independent standard error $s$, then $\operatorname{SE}(G_V)=2s$. At two-sided significance 5% and power 80%, the nominal nearest-rival gap requires $s\leq$ 0.0192 mV, equivalent to a contrast standard error of 0.0383 mV. With an assumed per-preparation standard deviation of 1 mV and independent observations, the planning calculation gives 2724 observations per condition. This noise level is an assumption, not a measured property of the proposed assay; covariance between repeated conditions must be estimated, and repeated imaging frames are not independent preparations.
  rationale: Variance adds over four independent condition means. Gaussian quantiles give the stated planning calculation; noise and independence are explicit assumptions.
- id: physiological-scope
  kind: interpretation
  passage: A model-generated paired response is a prediction of an assumed mechanism. Its discrepancy from a fitted rival measures distinguishability within the specified comparison, not predictive error against an observed paired response. Single-site agreement narrows a model family but does not independently validate its spatial mechanism. Unmeasured coupling, channel heterogeneity, membrane resetting and boundary loads remain potential sources of disagreement with tissue.
  rationale: The benchmark compares simulations to simulations. No paired physiological dataset was acquired or used to validate these predictions.
