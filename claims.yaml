- id: number-173
  kind: computation
  passage: Can paired capillary inputs distinguish distributed electrical interaction from independent sensing and a shared vascular nonlinearity? We implement a literature-constrained membrane network, screen single-exposure magnitude and recovery, fit rivals to isolated-input responses, and compare 128 withheld paired protocols. The central measurement contrasts sibling and distant input pairs with matched single-site waveforms. Uniqueness of a deterministic controller driven by their identical pooled inputs forces its geometry contrast to zero, irrespective of shared output saturation. The nominal distributed model predicts a 0.833 mV contrast under simultaneous stimulation; a conditional planning calculation gives 46 independent observations per condition. Concentration sweeps reveal a nearby sign reversal, while a bounded pooled filter fits poorly and localization ablations retain geometry effects. Only 29 of 8192 sampled vectors pass the initial screen, all above the reported mean-plus-or-minus-SD Kir conductance band. Slow Kir suppression improves recovery near the nominal point but yields no full-screen passes on the tested conductance-band grid. The contribution is an invariant null and a quantified synthetic discrimination design. Its physiological application requires measured source waveforms, preparation-specific timing and a reversible membrane regime compatible with the observed conductances.
  evidence:
    file: simulation/output/results.json
    run_id: paired-study
    pointer: /calibration/candidate_count
    reported: '8192'
    scale: 1
    decimals: 0
    units: sampled parameter vectors
    conditions: 'Single-input-only base-tree screen/fitting: connected exposure at10mM for18s and5s recovery; isolated-site traces span6,8,10,12mM. Parameter sampling and weights are stated in the recorded configuration; no empirical likelihood or paired fitting.'
