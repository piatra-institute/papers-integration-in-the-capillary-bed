- id: electrical-residual
  kind: definition
  passage: This compares responses at the same time. Subtracting separately timed peak amplitudes would answer a different question and could create an apparent interaction from a linear system. For independent sensors with passive propagation, the electrical residual vanishes for separate sites, regardless of nonlinear dependence of each sensor on its own input. A nonlinear shared state, including an arteriolar membrane, can produce a nonzero residual.
  rationale: The time-aligned paired-minus-single difference defines the electrical interaction. It avoids the invalid subtraction of separately timed peaks.
